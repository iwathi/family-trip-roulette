<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>家族旅行 行き先ルーレット</title>
    <link rel="stylesheet" href="style.css?v=11">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;700;900&display=swap" rel="stylesheet">
</head>
<body>
    <div class="container">
        <header>
            <h1>✈️ 家族旅行 行き先ルーレット 🚗</h1>
            <p>仙台発・家族5人向けの行き先を決めよう！</p>
            <div class="menu">
                <a href="list.html" class="menu-link">📋 全都道府県のデータ一覧を見る</a>
            </div>
        </header>

        <main>
            <section class="roulette-section">
                <div class="roulette-display" id="rouletteDisplay">
                    <div class="destination-name" id="destinationName">------</div>
                    <div class="destination-cost" id="destinationCost"></div>
                </div>
                
                <div id="resultDetails" class="result-details" style="display: none;">
                    <h3>おすすめ観光エリア・スポット</h3>
                    <ul id="spotsList" class="spots-list"></ul>
                    
                    <div id="mapContainer" class="map-container">
                        <!-- Map will be injected here -->
                    </div>

                    <a id="planLink" class="rakuten-btn" href="#" target="_blank" rel="noopener noreferrer">
                        🗺️ この県の観光プラン・モデルコースを見る
                    </a>
                </div>

                <button id="startBtn" class="start-btn">行き先を決める！</button>
            </section>

            <section class="filters-section">
                <h2>絞り込み設定</h2>
                
                <div class="filter-group">
                    <label for="budgetFilter">💰 予算上限（宿泊費＋最安交通費）</label>
                    <select id="budgetFilter">
                        <option value="unlimited">制限なし</option>
                        <option value="150000">15万円以内</option>
                        <option value="200000">20万円以内</option>
                        <option value="300000">30万円以内</option>
                        <option value="400000">40万円以内</option>
                        <option value="500000">50万円以内</option>
                    </select>
                </div>

                <div class="filter-group">
                    <label>🚆 希望する移動手段（複数選択可）</label>
                    <div style="display: flex; gap: 15px; margin-top: 5px;">
                        <label><input type="checkbox" id="modeCar" value="car" checked style="width:18px;height:18px;margin-right:5px;"> 車</label>
                        <label><input type="checkbox" id="modeShinkansen" value="shinkansen" checked style="width:18px;height:18px;margin-right:5px;"> 新幹線</label>
                        <label><input type="checkbox" id="modeFlight" value="flight" checked style="width:18px;height:18px;margin-right:5px;"> 飛行機</label>
                    </div>
                </div>

                <div class="filter-group">
                    <label for="timeFilter">⏳ 片道の移動時間上限</label>
                    <select id="timeFilter">
                        <option value="unlimited">制限なし</option>
                        <option value="120">2時間以内</option>
                        <option value="180">3時間以内</option>
                        <option value="300">5時間以内</option>
                        <option value="420">7時間以内</option>
                    </select>
                </div>
                
                <div class="filter-group">
                    <label>🎯 行きたいジャンル（絞り込む場合のみチェック）</label>
                    <div class="visited-prefectures-container" id="genreFiltersList">
                        <!-- Genre Checkboxes will be generated by JS -->
                    </div>
                </div>

                <div class="filter-group">
                    <label>🚫 行ったことがある都道府県を除外</label>
                    <div class="visited-prefectures-container" id="visitedPrefecturesList">
                        <!-- Checkboxes will be generated by JS -->
                    </div>
                </div>
            </section>
        </main>
        
        <footer>
            <p>※費用は仙台発・家族5人（大人2名、子供3名）の交通費と宿泊費の目安です。実際の価格とは異なる場合があります。</p>
        </footer>
    </div>
    <script src="data.js?v=6"></script>
    <script src="app.js?v=6"></script>
</body>
</html>
